<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Enclosure | Websites that win UK enquiries</title>
    <meta
      name="description"
      content="We build websites for UK businesses that need more enquiries, stronger local search, and a site that looks the part."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Enclosure" />
    <meta property="og:title" content="The Enclosure | Websites that win UK enquiries" />
    <meta
      property="og:description"
      content="We build websites for UK businesses that need more enquiries, stronger local search, and a site that looks the part."
    />
    <meta property="og:url" content="https://theenclosure.co.uk" />
    <meta property="og:image" content="https://theenclosure.co.uk/og-image.png" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Enclosure | Websites that win UK enquiries" />
    <meta
      name="twitter:description"
      content="We build websites for UK businesses that need more enquiries, stronger local search, and a site that looks the part."
    />
    <meta name="twitter:image" content="https://theenclosure.co.uk/og-image.png" />

    <!-- Google Search Console verification -->
    <!-- <meta name="google-site-verification" content="TBD_JOSH_TO_ADD" /> -->

    <!-- Organisation structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "The Enclosure",
        "url": "https://theenclosure.co.uk",
        "logo": "https://theenclosure.co.uk/logo.png",
        "description": "Web design and lead generation studio for UK businesses. We build sites that turn visitors into enquiries.",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Welwyn Garden City",
          "addressCountry": "GB"
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "email": "hello@theenclosure.co.uk",
          "contactType": "customer service",
          "areaServed": "GB"
        },
        "sameAs": []
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("enclosure-theme");
          var preference = stored === "light" || stored === "dark" || stored === "system" ? stored : "system";
          var dark =
            preference === "dark" ||
            (preference === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
